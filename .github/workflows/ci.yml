name: macOS checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    env:
      DAFEIYU_XHS_RUNTIME_DIR: ${{ github.workspace }}/.social-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Privacy and public file check
        run: python3 scripts/check-public.py
      - name: Unit and simulated integration tests
        run: bash scripts/test.sh
      - name: Build app
        run: bash scripts/build.sh
      - name: Social runtime dependencies
        run: bash scripts/setup-social.sh
      - name: Verify social runtime layout
        run: test -f "$DAFEIYU_XHS_RUNTIME_DIR/node_modules/playwright-core/package.json"
      - name: Real HTTP control boundary
        run: python3 scripts/test-control-panel.py 'dist/WeChat AI Bot.app/Contents/MacOS/WeChatAIBot'
